<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoparc — Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .serif { font-family: 'DM Serif Display', serif; }
    
    
    input:focus { outline: none; border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,0.12); }
    .tab-active   { color: #534AB7; border-bottom: 2px solid #534AB7; }
    .tab-inactive { color: #9ca3af; border-bottom: 2px solid transparent; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

  <div class="flex w-full max-w-3xl rounded-2xl overflow-hidden shadow-xl border border-gray-200 bg-white min-h-[560px]">

    <div class="relative flex flex-col justify-between p-10 bg-[#1a1a2e] w-5/12 overflow-hidden">
      <!-- <div class="blob1"></div>
      <div class="blob2"></div> -->
      <div class="serif text-white text-2xl relative z-10">shop<span class="italic text-[#9FE1CB]">arc</span></div>
      <div class="relative z-10">
        <h2 class="serif text-white text-3xl font-normal leading-snug mb-3">
          Your next<br /><em>favourite find</em><br />awaits.
        </h2>
        <p class="text-gray-400 text-sm font-light leading-relaxed">Thousands of products, curated<br />for those with taste.</p>
      </div>
      <div class="flex flex-wrap gap-2 relative z-10">
        <span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-gray-300 border border-white/10">🔒 Secure checkout</span>
        <span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-gray-300 border border-white/10">🚚 Free shipping</span>
        <span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-gray-300 border border-white/10">🔄 Easy returns</span>
      </div>
    </div>

    <div class="flex flex-col justify-center p-10 w-7/12">

      <div class="flex border-b border-gray-200 mb-8">
        <button id="tab-login" onclick="switchTab('login')"
          class="tab-active text-sm font-medium pb-2 mr-6 transition-all duration-150">Sign in</button>
        <button id="tab-register" onclick="switchTab('register')"
          class="tab-inactive text-sm font-medium pb-2 transition-all duration-150">Create account</button>
      </div>

      <div id="loginPanel">
        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1.5">Email address</label>
          <input id="email" type="email" placeholder="you@example.com"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50 text-gray-800 transition-all" />
        </div>
        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
          <input id="password" type="password" placeholder="••••••••"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50 text-gray-800 transition-all" />
        </div>
        <div class="text-right mb-5">
          <a href="#" class="text-xs text-[#534AB7] hover:underline">Forgot password?</a>
        </div>
        <button onclick="login()"
          class="w-full py-2.5 bg-[#1a1a2e] hover:bg-[#2d2d4e] text-white text-sm font-medium rounded-lg transition-all active:scale-[0.98]">
          Sign in
        </button>
        <p class="text-xs text-gray-400 text-center mt-5">
          No account? <a onclick="switchTab('register')" class="text-[#534AB7] font-medium cursor-pointer hover:underline">Create one free</a>
        </p>
      </div>

      <div id="registerPanel" class="hidden">
        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1.5">Full name</label>
          <input id="name-reg" type="text" placeholder="Jane Smith"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50 text-gray-800 transition-all" />
        </div>
        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1.5">Email address</label>
          <input id="email-reg" type="email" placeholder="you@example.com"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50 text-gray-800 transition-all" />
        </div>
        <div class="mb-6">
          <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
          <input id="password-reg" type="password" placeholder="Min. 6 characters"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50 text-gray-800 transition-all" />
        </div>
        <button onclick="register()"
          class="w-full py-2.5 bg-[#1a1a2e] hover:bg-[#2d2d4e] text-white text-sm font-medium rounded-lg transition-all active:scale-[0.98]">
          Create account
        </button>
        <p class="text-xs text-gray-400 text-center mt-5">
          Already have an account? <a onclick="switchTab('login')" class="text-[#534AB7] font-medium cursor-pointer hover:underline">Sign in</a>
        </p>
      </div>

    </div>
  </div>

  <script src="E-commerce.js"></script>
  <script>
    function switchTab(tab) {
      const loginPanel    = document.getElementById('loginPanel');
      const registerPanel = document.getElementById('registerPanel');
      const tabLogin      = document.getElementById('tab-login');
      const tabRegister   = document.getElementById('tab-register');
      const msg           = document.getElementById('auth-message');
      if (msg) msg.style.display = 'none';

      if (tab === 'login') {
        loginPanel.classList.remove('hidden');
        registerPanel.classList.add('hidden');
        tabLogin.className    = 'tab-active text-sm font-medium pb-2 mr-6 transition-all duration-150';
        tabRegister.className = 'tab-inactive text-sm font-medium pb-2 transition-all duration-150';
      } else {
        loginPanel.classList.add('hidden');
        registerPanel.classList.remove('hidden');
        tabLogin.className    = 'tab-inactive text-sm font-medium pb-2 mr-6 transition-all duration-150';
        tabRegister.className = 'tab-active text-sm font-medium pb-2 transition-all duration-150';
      }
    }
  </script>
</body>
</html>
